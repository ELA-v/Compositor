name: Build Compositor for macOS 12

on:
  workflow_dispatch:

jobs:
  build:
    # Use a modern macOS runner (macOS 14 Apple Silicon)
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build App targeted for macOS 12
        run: |
          xcodebuild -project Compositor.xcodeproj \
                     -scheme Compositor \
                     -configuration Release \
                     MACOSX_DEPLOYMENT_TARGET=12.0 \
                     CODE_SIGN_IDENTITY="" \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGNING_ALLOWED=NO \
                     clean build \
                     CONFIGURATION_BUILD_DIR=build/Release

      - name: Compress Build Artifact
        run: |
          cd build/Release
          zip -r ~/Compositor-macOS12.zip Compositor.app

      - name: Upload Finished App
        uses: actions/upload-artifact@v4
        with:
          name: Compositor-macOS12-App
          path: ~/Compositor-macOS12.zip
