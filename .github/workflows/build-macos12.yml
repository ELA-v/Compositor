name: Build Compositor for macOS 12

on:
  workflow_dispatch: # Gives you a manual "Run workflow" button in GitHub

jobs:
  build:
    runs-on: macos-12 # Tells GitHub to use a cloud server running macOS 12 Monterey

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: sudo xcode-select -s /Applications/Xcode_14.2.app

      - name: Build App for macOS 12
        run: |
          xcodebuild -project Compositor.xcodeproj \
                     -scheme Compositor \
                     -configuration Release \
                     MACOSX_DEPLOYMENT_TARGET=12.0 \
                     clean build

      - name: Compress Build Artifact
        run: |
          cd build/Release || cd ~/Library/Developer/Xcode/DerivedData/*/Build/Products/Release
          zip -r ~/Compositor-macOS12.zip Compositor.app

      - name: Upload Finished App
        uses: actions/upload-artifact@v4
        with:
          name: Compositor-macOS12-App
          path: ~/Compositor-macOS12.zip
